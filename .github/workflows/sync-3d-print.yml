name: Sync 3D print archive

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/print-public.json'
      - 'tools/print-page.html'
      - 'tools/export-3d-print.mjs'
      - 'tools/check-site.mjs'
      - '.github/workflows/sync-3d-print.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-3d-print
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout model source
        uses: actions/checkout@v4
        with:
          repository: mizy/mz-3d-print
          path: .source
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Export curated models
        run: node tools/export-3d-print.mjs --source .source

      - name: Verify generated site
        run: node tools/check-site.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mz-3d-print
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync 3D print archive from mizy/mz-3d-print"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
